# Disposable database for the deployment smoke test, never for live data.
services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: ims_ci
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
    networks: [app]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ci -d ims_ci']
      interval: 5s
      timeout: 5s
      retries: 10
