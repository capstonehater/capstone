worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 4096; }

http {
    include /etc/nginx/mime.types;
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    sendfile on;
    keepalive_timeout 30s;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    upstream api_pool {
        zone api_pool 64k;
        least_conn;
        server api:4000 resolve max_fails=2 fail_timeout=10s;
        keepalive 32;
    }
    upstream web_pool {
        zone web_pool 64k;
        least_conn;
        server web:3000 resolve max_fails=2 fail_timeout=10s;
        keepalive 32;
    }

    # Shared zones cover all API replicas behind this edge process.
    limit_req_zone $binary_remote_addr zone=client_rate:20m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=sustained_rate:20m rate=5r/s;
    limit_req_zone $server_name zone=global_rate:1m rate=500r/s;
    limit_req_zone $binary_remote_addr zone=login_rate:10m rate=2r/m;
    limit_req_zone $binary_remote_addr zone=forgot_rate:10m rate=1r/m;
    limit_req_zone $binary_remote_addr zone=reset_rate:10m rate=1r/m;
    limit_conn_zone $binary_remote_addr zone=client_connections:10m;
    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 8080;
        server_name salvacion;
        client_max_body_size 6m;
        client_body_timeout 15s;
        client_header_timeout 15s;
        limit_conn client_connections 50;
        error_page 429 = @rate_limited;

        location @rate_limited {
            default_type application/json;
            add_header Retry-After 60 always;
            add_header Cache-Control no-store always;
            return 429 '{"statusCode":429,"message":"Too many requests. Please try again later."}';
        }
        location = /edge-health { access_log off; return 200 'ok'; }
        location = /backend { return 308 /backend/$is_args$args; }

        # Auth budgets remain shared when the API replica count increases.
        location ~* ^/backend/auth/login/?$ {
            limit_req zone=login_rate burst=29 nodelay;
            limit_req zone=global_rate burst=500 nodelay;
            include /etc/nginx/proxy-headers.conf;
            rewrite (?i)^/backend/(.*)$ /$1 break;
            proxy_pass http://api_pool;
        }
        location ~* ^/backend/auth/forgot-password/?$ {
            limit_req zone=forgot_rate burst=4 nodelay;
            limit_req zone=global_rate burst=500 nodelay;
            include /etc/nginx/proxy-headers.conf;
            rewrite (?i)^/backend/(.*)$ /$1 break;
            proxy_pass http://api_pool;
        }
        location ~* ^/backend/auth/(reset-password|redeem-password-reset)/?$ {
            limit_req zone=reset_rate burst=9 nodelay;
            limit_req zone=global_rate burst=500 nodelay;
            include /etc/nginx/proxy-headers.conf;
            rewrite (?i)^/backend/(.*)$ /$1 break;
            proxy_pass http://api_pool;
        }
        location /backend/ {
            limit_req zone=client_rate burst=30 nodelay;
            limit_req zone=sustained_rate burst=300 nodelay;
            limit_req zone=global_rate burst=500 nodelay;
            include /etc/nginx/proxy-headers.conf;
            proxy_pass http://api_pool/;
        }
        location / {
            limit_req zone=client_rate burst=60 nodelay;
            limit_req zone=global_rate burst=500 nodelay;
            include /etc/nginx/proxy-headers.conf;
            proxy_buffering off;
            proxy_pass http://web_pool;
        }
    }
}
