name: CI and release preparation

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      environment:
        description: Prepare a release candidate (does not deploy to a host)
        type: choice
        required: true
        default: development
        options:
          - development
          - production

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.environment || 'development' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release-candidate:
    name: Prepare release candidate
    needs: checks
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/feature/route-policy-centralization') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.environment || 'development' }}
    concurrency:
      group: release-${{ inputs.environment || 'development' }}
      cancel-in-progress: false
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment || 'development' }}
      PRODUCTION_BRANCH: ${{ vars.PRODUCTION_BRANCH }}
      CURRENT_BRANCH: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Enforce release branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo 'Release preparation requires a branch.' >&2
            exit 1
          fi
          if [[ "$TARGET_ENVIRONMENT" == "production" ]]; then
            if [[ -z "$PRODUCTION_BRANCH" || "$CURRENT_BRANCH" != "$PRODUCTION_BRANCH" ]]; then
              echo 'Set PRODUCTION_BRANCH and run from that protected branch.' >&2
              exit 1
            fi
          elif [[ "$CURRENT_BRANCH" != 'feature/route-policy-centralization' ]]; then
            echo 'Development candidates must come from feature/route-policy-centralization.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package-release.py --revision "$RELEASE_SHA" --environment "$TARGET_ENVIRONMENT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.environment || 'development' }}-${{ github.sha }}
          path: .release-output/*
          if-no-files-found: error
          retention-days: 30
      - name: Record candidate
        shell: bash
        run: |
          printf '### Release candidate\n\nEnvironment: `%s`\n\nCommit: `%s`\n\nChecks passed. Source package prepared; no host deployment was performed.\n' \
            "$TARGET_ENVIRONMENT" "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
