name: Reusable checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ims-backend
    env:
      NODE_ENV: test
      ENABLE_BACKGROUND_JOBS: 'false'
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ims_ci?schema=public
      SESSION_TOKEN_SECRET: ci-only-session-secret-never-use-in-production
      RESET_TOKEN_SECRET: ci-only-reset-secret-never-use-in-production
      FRONTEND_ORIGIN: http://localhost:3000
      FRONTEND_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ims-backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma validate
      - run: npm run lint:check
      - run: npm test -- --runInBand
      - run: npm run test:e2e -- --runInBand
      - run: npm run build

  migrations:
    name: Migration replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ims_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ims_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: ims-backend
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ims_ci?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ims-backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:migrate:deploy
      - run: npx prisma migrate status
      - name: Check replayed schema matches the Prisma schema
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ims-frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_BASE_URL: /backend
      API_UPSTREAM_URL: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ims-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: node --test tests/*.test.cjs
      - run: npm run build

  python:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            python/requirements.txt
            AI-Store Reco/requirements.txt
      - run: python -m pip install -r python/requirements.txt -r "AI-Store Reco/requirements.txt"
      - run: python -m unittest discover -s python -p 'test_*.py'
      - run: python -m unittest discover -s "AI-Store Reco" -p 'test_*.py'
      - run: python -m unittest discover -s scripts/tests -p 'test_*.py'
